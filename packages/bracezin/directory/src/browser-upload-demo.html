<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directory Media Chunk Upload</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            max-width: 760px;
            margin: 0 auto;
        }

        .box {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        input,
        button,
        select {
            width: 100%;
            margin-top: 12px;
            padding: 10px 12px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }

        .progress {
            width: 100%;
            height: 18px;
            background: #f1f5f9;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 14px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #22c55e;
            transition: width 0.2s ease;
        }

        pre {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            overflow: auto;
            margin-top: 18px;
        }
    </style>
</head>

<body>
    <h2>Directory Media Chunk Upload</h2>

    <div class="box">
        <input id="fileInput" type="file" />
        <select id="diskSelect">
            <option value="local">local</option>
            <option value="public">public</option>
            <option value="s3">s3</option>
        </select>
        <button id="uploadBtn">Upload</button>

        <div class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <p id="statusText">Waiting for file...</p>
        <pre id="resultBox">{}</pre>
    </div>

    <script>
        async function computeSha256(fileOrBlob) {
            const buffer = await fileOrBlob.arrayBuffer();
            const digest = await crypto.subtle.digest('SHA-256', buffer);
            const bytes = Array.from(new Uint8Array(digest));
            return bytes.map((b) => b.toString(16).padStart(2, '0')).join('');
        }

        async function uploadFileInChunks(file, options = {}) {
            const {
                url = '/api/upload-media',
                    uploadId = crypto.randomUUID ? crypto.randomUUID() :
                    `upload-${Date.now()}-${Math.random().toString(16).slice(2)}`,
                    chunkSize = 1024 * 1024,
                    disk = 'local',
                    fileName = file.name,
                    mime = file.type || 'application/octet-stream',
                    totalSize = file.size,
                    token = null,
                    onProgress = () => {},
            } = options;

            const totalChunks = Math.ceil(file.size / chunkSize);
            const finalChecksum = await computeSha256(file);

            for (let index = 0; index < totalChunks; index++) {
                const start = index * chunkSize;
                const end = Math.min(start + chunkSize, file.size);
                const chunk = file.slice(start, end);
                const chunkChecksum = await computeSha256(chunk);

                const formData = new FormData();
                formData.append('file', chunk, fileName);
                formData.append('upload_id', uploadId);
                formData.append('chunk_index', String(index));
                formData.append('total_chunks', String(totalChunks));
                formData.append('original_file_name', fileName);
                formData.append('name', fileName);
                formData.append('type', mime);
                formData.append('disk', disk);
                formData.append('total_size', String(totalSize));
                formData.append('checksum', finalChecksum);
                formData.append('chunk_checksum', chunkChecksum);

                const headers = {};
                if (token) {
                    headers.Authorization = `Bearer ${token}`;
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers,
                    body: formData,
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || 'Chunk upload failed');
                }

                const progress = ((index + 1) / totalChunks) * 100;
                onProgress(progress, result);
            }

            return {
                uploadId,
                totalChunks,
                fileName,
                disk,
            };
        }

        document.getElementById('uploadBtn').addEventListener('click', async () => {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const disk = document.getElementById('diskSelect').value;

            if (!file) {
                document.getElementById('statusText').textContent = 'Please choose a file first.';
                return;
            }

            const progressBar = document.getElementById('progressBar');
            const resultBox = document.getElementById('resultBox');

            try {
                document.getElementById('statusText').textContent = 'Uploading...';

                const response = await uploadFileInChunks(file, {
                    disk,
                    chunkSize: 1024 * 1024,
                    onProgress: (percent, result) => {
                        progressBar.style.width = percent + '%';
                        document.getElementById('statusText').textContent = 'Uploading: ' +
                            percent.toFixed(1) + '%';
                        resultBox.textContent = JSON.stringify(result, null, 2);
                    },
                });

                progressBar.style.width = '100%';
                document.getElementById('statusText').textContent = 'Upload complete.';
                resultBox.textContent = JSON.stringify(response, null, 2);
            } catch (error) {
                document.getElementById('statusText').textContent = 'Upload failed.';
                resultBox.textContent = JSON.stringify({
                    error: error.message
                }, null, 2);
            }
        });
    </script>
</body>

</html>
